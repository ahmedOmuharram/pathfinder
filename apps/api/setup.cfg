[mutmut]
# Mutation testing — verifies the test suite actually catches code mutations.
# Wired but not yet running cleanly: mutmut 3.x mirrors `paths_to_mutate` into a
# `mutants/` scratch tree but doesn't preserve `src/pathfinder/` test prefixes,
# which collides with this project's `testpaths = ["src/pathfinder/tests"]` in
# pyproject.toml. Running mutmut requires either:
#   - flattening the test layout (out of scope here), or
#   - patching pyproject.toml inside mutants/ to point testpaths at the copied tree.
#
# Once that's resolved:
#   uv run python -m mutmut run         (mutate + score)
#   uv run python -m mutmut results     (show survivors)
#   uv run python -m mutmut browse      (TUI to inspect each survivor)
#
# Scope is intentionally narrow (pure domain modules) so wall time stays bounded.
paths_to_mutate=src/pathfinder/domain/strategy/
tests_dir=src/pathfinder/tests/unit/domain/strategy/
also_copy=src/pathfinder/tests/__init__.py,src/pathfinder/tests/conftest.py,src/pathfinder/tests/unit/__init__.py,src/pathfinder/tests/unit/conftest.py,src/pathfinder/tests/unit/domain/__init__.py,src/pathfinder/tests/unit/domain/strategy/,src/pathfinder/tests/fixtures/
