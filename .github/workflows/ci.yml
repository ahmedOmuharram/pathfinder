name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-api:
    name: Lint API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync

      - name: Run ruff
        working-directory: apps/api
        run: uv run ruff check .

      - name: Check formatting
        working-directory: apps/api
        run: uv run ruff format --check .

      - name: Run mypy
        working-directory: apps/api
        run: uv run mypy src

      - name: Run pyright
        working-directory: apps/api
        run: uv run pyright src/pathfinder

      - name: Check import-linter contracts
        working-directory: apps/api
        run: uv run lint-imports

      - name: Check file sizes
        working-directory: apps/api
        run: uv run python scripts/check_max_lines.py

      - name: Audit dependencies
        working-directory: apps/api
        run: uv run pip-audit

      - name: Check OpenAPI spec is up to date
        working-directory: apps/api
        run: uv run python -m pathfinder.devtools.openapi check

  build-docs:
    name: Build API docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync

      - name: Build Sphinx docs
        working-directory: apps/api
        run: uv run sphinx-build -b html docs docs/_build/html

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pathfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync

      - name: Run tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pathfinder_test
          API_SECRET_KEY: test-secret-key-xxxxx-xxxxx-xxxxx
          PATHFINDER_CHAT_PROVIDER: mock
        run: uv run pytest --cov=src --cov-report=xml --cov-fail-under=40

  lint-web:
    name: Lint Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ESLint
        working-directory: apps/web
        run: yarn lint

      - name: Check formatting
        working-directory: apps/web
        run: yarn format:check

      - name: Type check
        working-directory: apps/web
        run: yarn typecheck

      - name: Check architectural boundaries
        working-directory: apps/web
        run: yarn check:boundaries

  check-shared-ts:
    name: Check shared TS types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check generated types are up to date
        working-directory: packages/shared-ts
        run: yarn check:generated

  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run unit tests (with coverage)
        working-directory: apps/web
        run: yarn test:coverage

  test-e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The e2e stack runs the production images: the API bakes the PIGuard
      # model + serves real settings, and web runs the standalone server
      # (`next start` cannot serve `output: "standalone"`). The e2e overlay
      # forces API_ENV=test + mock provider and maps the DB to 5433.
      - name: Prepare e2e env
        run: |
          cp .env.test.example .env.test
          printf '\nAPI_SECRET_KEY=%s\n' "$(openssl rand -hex 32)" >> .env.test

      - name: Build + start the stack (mock provider, test env)
        run: |
          docker compose --env-file .env.test \
            -f docker-compose.yml -f docker-compose.e2e.yml \
            up -d --build api web worker

      - name: Wait for API + web
        run: |
          ok=
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8000/health/ready >/dev/null 2>&1 && { ok=1; break; }
            sleep 5
          done
          [ -n "$ok" ] || { echo "API not ready"; docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs api | tail -80; exit 1; }
          ok=
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3000/ >/dev/null 2>&1 && { ok=1; break; }
            sleep 2
          done
          [ -n "$ok" ] || { echo "web not ready"; docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs web | tail -50; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install web dependencies
        run: yarn install --immutable

      - name: Install Playwright browsers
        working-directory: apps/web
        run: yarn playwright install --with-deps

      - name: Run Playwright tests
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: yarn test:e2e

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --tail=120

      - name: Tear down
        if: always()
        run: |
          docker compose --env-file .env.test \
            -f docker-compose.yml -f docker-compose.e2e.yml down -v
