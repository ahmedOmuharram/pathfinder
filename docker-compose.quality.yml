# Code-quality overlay — SonarQube + its Postgres.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.quality.yml --profile quality up -d
#
# Dashboard: http://localhost:9000  (login: admin / admin)
# Scan:      Run tests with coverage first, then `sonar-scanner` from repo root.

services:
  sonarqube:
    profiles: ["quality"]
    image: sonarqube:community
    depends_on:
      sonar-db:
        condition: service_healthy
    ports:
      - "${SONAR_PORT:-9000}:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q UP"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

  sonar-db:
    profiles: ["quality"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_postgres_data:
