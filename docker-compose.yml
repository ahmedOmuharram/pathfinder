services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      API_ENV: ${API_ENV:-production}
      API_SECRET_KEY: ${API_SECRET_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      PATHFINDER_CHAT_PROVIDER: ${PATHFINDER_CHAT_PROVIDER:?Set PATHFINDER_CHAT_PROVIDER=default for real providers or use the test overlay for mock mode}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-anthropic}
      DEFAULT_TIER: ${DEFAULT_TIER:-balanced}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      S2_API_KEY: ${S2_API_KEY:-}
      VEUPATHDB_SITES_CONFIG: ${VEUPATHDB_SITES_CONFIG:-}
      VEUPATHDB_AUTH_TOKEN: ${VEUPATHDB_AUTH_TOKEN:-}
      VEUPATHDB_OAUTH_URL: ${VEUPATHDB_OAUTH_URL:-}
      VEUPATHDB_OAUTH_CLIENT_ID: ${VEUPATHDB_OAUTH_CLIENT_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: .venv/bin/python -m pathfinder.jobs.worker
    # Worker shares the API image (and its curl-based FastAPI healthcheck).
    # The worker process does not serve HTTP, so override with a no-op probe —
    # Procrastinate's own crash-on-error handling restarts the container via
    # ``restart: always`` if the worker loop dies.
    healthcheck:
      disable: true
    environment:
      API_ENV: ${API_ENV:-production}
      API_SECRET_KEY: ${API_SECRET_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      PATHFINDER_CHAT_PROVIDER: ${PATHFINDER_CHAT_PROVIDER:?Set PATHFINDER_CHAT_PROVIDER=default for real providers or use the test overlay for mock mode}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-anthropic}
      DEFAULT_TIER: ${DEFAULT_TIER:-balanced}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      S2_API_KEY: ${S2_API_KEY:-}
      VEUPATHDB_SITES_CONFIG: ${VEUPATHDB_SITES_CONFIG:-}
      VEUPATHDB_AUTH_TOKEN: ${VEUPATHDB_AUTH_TOKEN:-}
      VEUPATHDB_OAUTH_URL: ${VEUPATHDB_OAUTH_URL:-}
      VEUPATHDB_OAUTH_CLIENT_ID: ${VEUPATHDB_OAUTH_CLIENT_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      LOG_FORMAT: ${LOG_FORMAT:-}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pathfinder}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
