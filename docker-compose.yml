services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      worker:
        condition: service_started
    environment:
      API_ENV: ${API_ENV:-production}
      API_SECRET_KEY: ${API_SECRET_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      PATHFINDER_CHAT_PROVIDER: ${PATHFINDER_CHAT_PROVIDER:?Set PATHFINDER_CHAT_PROVIDER=default for real providers or use the test overlay for mock mode}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-anthropic}
      DEFAULT_TIER: ${DEFAULT_TIER:-balanced}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      S2_API_KEY: ${S2_API_KEY:-}
      VEUPATHDB_SITES_CONFIG: ${VEUPATHDB_SITES_CONFIG:-}
      VEUPATHDB_AUTH_TOKEN: ${VEUPATHDB_AUTH_TOKEN:-}
      VEUPATHDB_OAUTH_URL: ${VEUPATHDB_OAUTH_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
      # Set PIGUARD_ENABLED=false to skip the prompt-injection model load + per-message scan.
      PIGUARD_ENABLED: ${PIGUARD_ENABLED:-true}
      # Set OTEL_INCLUDE_CONTENT=true to export prompts and completions in agent traces.
      OTEL_INCLUDE_CONTENT: ${OTEL_INCLUDE_CONTENT:-false}
      # Seconds of silence after which the chat SSE stream sends a comment frame.
      SSE_KEEPALIVE_SECONDS: ${SSE_KEEPALIVE_SECONDS:-15}
      # Dev WDK login for the chat debugger (pathfinder.devtools.chat); set in .env.dev.
      WDK_DEV_EMAIL: ${WDK_DEV_EMAIL:-}
      WDK_DEV_PASSWORD: ${WDK_DEV_PASSWORD:-}
    volumes:
      # Devtools chat-debugger run artifacts (pathfinder.devtools.chat) land on
      # the host so they can be inspected outside the container.
      - ./apps/api/.pf-runs:/data/pf-runs
      # Per-site embedding index cache. Shared with the worker and kept across
      # recreates, so only a changed catalog is re-encoded.
      - embeddings_cache:/app/apps/api/src/pathfinder/data/embeddings

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: .venv/bin/python -m pathfinder.jobs.worker
    # Shares the API image but serves no HTTP — disable the curl healthcheck.
    # restart covers the boot window before the API applies the DB schema, and
    # any later crash of the worker loop.
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_ENV: ${API_ENV:-production}
      API_SECRET_KEY: ${API_SECRET_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      PATHFINDER_CHAT_PROVIDER: ${PATHFINDER_CHAT_PROVIDER:?Set PATHFINDER_CHAT_PROVIDER=default for real providers or use the test overlay for mock mode}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-anthropic}
      DEFAULT_TIER: ${DEFAULT_TIER:-balanced}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      S2_API_KEY: ${S2_API_KEY:-}
      VEUPATHDB_SITES_CONFIG: ${VEUPATHDB_SITES_CONFIG:-}
      VEUPATHDB_AUTH_TOKEN: ${VEUPATHDB_AUTH_TOKEN:-}
      VEUPATHDB_OAUTH_URL: ${VEUPATHDB_OAUTH_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
      # Jobs the worker runs in parallel, across every queue.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      # Age at which a job still in 'doing' is failed so its lock releases.
      WORKER_STALLED_JOB_TIMEOUT_SECONDS: ${WORKER_STALLED_JOB_TIMEOUT_SECONDS:-3600}
    volumes:
      - ./apps/api/.pf-runs:/data/pf-runs
      - embeddings_cache:/app/apps/api/src/pathfinder/data/embeddings

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pathfinder}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  embeddings_cache:
